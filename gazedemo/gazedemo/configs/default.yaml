# Mọi số là placeholder; chỉnh sau bench / cue.
source:
  device: 4               # D435i RGB trên laptop Linux (2 = hồng ngoại, 6 = camera laptop); đổi theo `doctor`
  backend: auto           # auto (Windows → dshow, Linux → v4l2) | dshow | msmf | v4l2 | any
  width: 1280
  height: 720
  fps: 30
  fourcc: null            # D435i RGB không có MJPG → mặc định (YUYV); webcam thường trên Windows: MJPG
  record: true            # ghi video.mp4 + frames.csv để chạy offline
  codec: mp4v             # codec của video.mp4
aoi:
  file: aoi.json
  names: [A, B, C]
  margin: 0.10            # phóng elip thêm 10%
  min_ray_angle_deg: 15
gazelle:
  name: gazelle_dinov2_vitl14_inout   # đổi gazelle_dinov2_vitb14_inout nếu bench quá chậm
  repo: "../../gazelle-main (1)/gazelle-main"   # mã nguồn Gazelle local (tương đối với thư mục dự án); không có → torch.hub fkryan/gazelle
  ckpt: null              # null → <repo>/checkpoints/<name>.pt; không có file thì tải từ GitHub release
  device: auto            # cuda > cpu
  fp16: true
  warmup: 5
  preprocess: gpu         # gpu: ToTensor/Normalize/Resize của Gazelle chạy trên GPU; pil: đúng đường PIL gốc
assign:
  gamma: 1.0
  tau_mass: 0.35
  delta: 0.10
  tau_inout: 0.5
dwell:
  min_dwell_ms: 100
  max_gap_ms: 150
  max_interval_s: 0.3     # config.py cảnh báo nếu < 2 × khoảng cách sample thực tế
  lookback_s: 2.0
  buffer_s: 10.0          # tracker giữ ít nhất chừng này giây sample khi không có trial
trial:
  trial_s: null           # live: null = kết thúc bằng phím E
  finalize_timeout_s: 1.0
cue:
  n_rep: 5
  cue_s: 4.0
  settle_s: 1.0
  seed: 0
collect:
  trial_s: 5.0
  show_result_s: 2.0
  countdown_s: 1.0        # đếm ngược trước bíp t0 (không tính vào trial)
  seed: 0
calibration:
  file: models/calibration.json   # có file này → thêm p_look_cal trên UI và trials.csv
  eps: 1.0e-4             # softmax(log(q + eps) / T)
score:
  n_bins: 5               # reliability: bin q_max 0–0.2, …, 0.8–1
dataset:
  min_valid_ratio: 0.6
train:
  feature_sets: [g1, g1g2, g1g2g3, all, liking_only, all+liking]
  l2: 1.0
  k_folds: 5
  seeds: [0, 1, 2, 3, 4]
  min_trials: 20
  dwell_T_ms: 1500        # baseline "dwell ≥ T"
  bootstrap: 1000
  baseline_eps: 0.05      # baseline cứng: xác suất 1 − ε cho đĩa dự đoán (log-loss)
ui:
  font: null              # null = tự tìm font TTF có dấu tiếng Việt (Arial/Segoe UI/DejaVu)
  font_size: 22
  panel_width: 660
  heatmap: true           # trạng thái phím H lúc mở
  heatmap_alpha: 0.5
  beep_hz: 1000
  beep_ms: 150
synth:
  hz: 15.0                # tần số sample giả lập
  seed: 0
output:
  root: runs
